# Production-style stack: Postgres + API + nginx-served SPA.
#   cp deploy/env.production.example deploy/.env.production   # then fill it in
#   docker compose --env-file deploy/.env.production up -d --build
# NOTE: this compose file has not been run in the environment it was written in; treat it as a
# starting point and smoke-test it (docker compose ps, curl localhost:8080/api/health).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-higgsfield}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-higgsfield}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-higgsfield}']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-higgsfield}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-higgsfield}
      AUTH_PROVIDER: clerk
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?set CLERK_SECRET_KEY}
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:?set SECRETS_ENCRYPTION_KEY}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:8080}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      HIGGSFIELD_API_KEY: ${HIGGSFIELD_API_KEY:-}
      HIGGSFIELD_API_BASE: ${HIGGSFIELD_API_BASE:-}
      SEED_DEMO_DATA: 'false'

  frontend:
    build:
      context: ./frontend
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:?set VITE_CLERK_PUBLISHABLE_KEY}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '8080:80'

volumes:
  pgdata:
